default:
  after_script:
    - |
      for dir in target/debug/deps target/debug/incremental target/debug/build target/debug/.fingerprint target/release/deps target/release/incremental target/release/build target/release/.fingerprint; do
        if [ -d "$dir" ]; then rm -rf -- "$dir" 2>/dev/null || true; fi
      done
  tags:
    - eqeqo-vps1

stages:
  - test
  - release-check
  - release

test:
  stage: test
  interruptible: true
  script:
    - sh cicd/test.sh

release-check:
  stage: release-check
  interruptible: true
  script:
    - sh cicd/publish.sh --dry-run
  rules:
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'

release:
  stage: release
  script:
    - sh cicd/publish.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
