openapi: 3.2.1
info:
  title: "httpageboy"
  version: "2.1.0"
servers:
  - url: "http://127.0.0.1"
paths:
  /:
    get:
      summary: "PageBoy example"
      operationId: "demo_get"
      parameters: []
      responses:
        "200":
          description: "HTML example"
  /query:
    query:
      summary: "Safe query with request content"
      operationId: "demo_query"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "string"
      responses:
        "200":
          description: "Query result"
